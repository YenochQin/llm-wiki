[project]
name = "llm-wiki"
version = "0.1.0"
description = "Personal LLM-maintained research wiki — OmegaWiki workflow with MinerU PDF preprocessing."
requires-python = ">=3.10"
dependencies = [
    # Core wiki tooling. PDF preprocessing is handled by MinerU.
    "httpx>=0.27,<1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# MinerU local backend — downloads several GB of models on first run.
# Cloud (api) backend is the default and only needs `requests`, already in core deps.
local = ["mineru[all]>=2.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# llm-wiki ships scripts under tools/ and mcp-servers/, not an importable Python package.
# Tell setuptools not to auto-discover any top-level dirs (raw/, wiki/, i18n/, ...)
# so `uv sync` installs only the dependencies above.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
